
<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core UI System Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#0a0a0a',
              surface: '#111111',
              border: 'rgba(153, 153, 153, 0.1)',
              primary: '#999999',
              accent: 'var(--system-accent)',
            },
            fontFamily: {
              sans: ['var(--font-primary)', 'Inter', 'sans-serif'],
              mono: ['var(--font-mono)', 'JetBrains Mono', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --system-accent: #000000;
        --grid-opacity: 0.08;
        --font-primary: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      
      html.dark {
        --system-accent: #ffffff;
      }

      body {
        margin: 0;
        font-family: var(--font-primary);
        overflow: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      html.dark body {
        background-color: #0a0a0a;
        color: #e0e0e0;
      }
      
      html:not(.dark) body {
        background-color: #f1f3f6;
        color: #1a1a1a;
      }

      .font-mono {
        font-family: var(--font-mono);
      }

      .blueprint-grid {
        background-size: 30px 30px;
        transition: background-image 0.3s ease;
      }

      html.dark .blueprint-grid {
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, var(--grid-opacity)) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, var(--grid-opacity)) 1px, transparent 1px);
      }

      html:not(.dark) .blueprint-grid {
        background-image: 
          linear-gradient(to right, rgba(0, 0, 0, var(--grid-opacity)) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, var(--grid-opacity)) 1px, transparent 1px);
      }

      /* Density Overrides */
      .density-compact .blueprint-grid > div {
        padding: 1.5rem;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 10px;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.2);
      }

      /* Code Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
