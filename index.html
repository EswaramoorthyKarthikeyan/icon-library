<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core UI System Explorer</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --system-accent: #0969da;
      --grid-opacity: 0.05;
      --font-primary: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --canvas-subtle: #f6f8fa;
      --border-default: #eceef0;
    }

    html.dark {
      --system-accent: #2f81f7;
      --grid-opacity: 0.1;
      --canvas-subtle: #0d1117;
      --border-default: #21262d;
    }

    body {
      margin: 0;
      font-family: var(--font-primary);
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
      background-color: var(--canvas-subtle);
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    .blueprint-grid {
      background-size: 24px 24px;
      transition: background-image 0.3s ease;
      background-image:
        linear-gradient(to right, var(--color-border-subtle, rgba(0, 0, 0, 0.05)) 1px, transparent 1px),
        linear-gradient(to bottom, var(--color-border-subtle, rgba(0, 0, 0, 0.05)) 1px, transparent 1px);
    }

    html.dark .blueprint-grid {
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }

    html.dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
      background-clip: content-box;
    }

    .glass {
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.8);
    }

    html.dark .glass {
      background: rgba(13, 17, 23, 0.8);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "@google/generative-ai": "https://esm.sh/@google/generative-ai@^0.21.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
